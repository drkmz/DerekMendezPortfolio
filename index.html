<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0468FF" />
  <title>Under construction | New York Life</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      --nyl-blue: #0468FF;
      --text: #000000;
      --background: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: clamp(32px, 5vw, 72px);
    }

    .brand {
      align-self: flex-start;
    }

    .logo {
      display: block;
      width: 9vmax;
      min-width: 72px;
      max-width: 150px;
      height: auto;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 760px;
      padding: clamp(48px, 8vh, 112px) 0;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.75rem, 7vw, 6rem);
      font-weight: 400;
      line-height: 0.98;
      letter-spacing: -0.035em;
    }

    p {
      margin: 24px 0 0;
      max-width: 36rem;
      font-size: clamp(1rem, 1.5vw, 1.25rem);
      line-height: 1.5;
    }

    @media (max-width: 640px) {
      .page {
        padding: 32px 24px;
      }

      .logo {
        width: 18vw;
        min-width: 72px;
        max-width: 96px;
      }

      main {
        padding: 64px 0 96px;
      }
    }
  </style>
</head>
<body>
<div class="page">
  <header class="brand" aria-label="New York Life">
    <img class="logo" src="logo.svg" alt="New York Life" />
  </header>

  <main>
    <h1>Under construction</h1>
    <p>Please check back soon.</p>
  </main>
</div>
</body>
</html>
