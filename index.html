<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Under Construction</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <style>
    :root {
      --nyl-blue: #0a6cff;
      --text: #111827;
      --muted: #6b7280;
      --bg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(92vw, 640px);
      padding: 48px 24px;
      text-align: center;
    }

    .logo {
      display: block;
      width: min(260px, 72vw);
      height: auto;
      margin: 0 auto 32px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 4rem);
      line-height: 1;
      letter-spacing: 0.08em;
      font-weight: 700;
      text-transform: uppercase;
    }

    .line {
      width: 72px;
      height: 4px;
      margin: 24px auto 0;
      border-radius: 999px;
      background: var(--nyl-blue);
    }

    p {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }
  </style>
</head>
<body>
<main>
  <img class="logo" src="images/logo.svg" alt="New York Life" />
  <h1>Under Construction</h1>
  <div class="line" aria-hidden="true"></div>
  <p>Please check back soon.</p>
</main>
</body>
</html>
