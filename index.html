<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0468FF" />
  <title>Under construction | New York Life</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <style>
    :root {
      --nyl-blue: #0468FF;
      --nyl-dark-blue: #000A62;
      --nyl-light-blue: #80BAFF;
      --white: #FFFFFF;
      --black: #000000;
      --light-gray: #E3E0DD;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--white);
      color: var(--black);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .site-shell {
      height: 100vh;
      height: 100dvh;
      min-height: 620px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
    }

    .site-header {
      display: flex;
      align-items: center;
      height: clamp(96px, 13vh, 124px);
      padding: 22px clamp(32px, 6vw, 88px);
      background: var(--white);
      border-bottom: 1px solid var(--light-gray);
      flex-shrink: 0;
    }

    .logo {
      display: block;
      width: clamp(70px, 6.5vw, 92px);
      height: auto;
    }

    .hero-wrap {
      min-height: 0;
      display: flex;
      padding: clamp(20px, 3vh, 34px) clamp(32px, 6vw, 88px) clamp(28px, 4vh, 44px);
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(220px, 0.45fr);
      overflow: hidden;
      background: var(--nyl-dark-blue);
    }

    .hero-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(38px, 7vh, 76px) clamp(42px, 7vw, 112px);
      color: var(--white);
    }

    h1 {
      max-width: 780px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.4rem, 6.8vw, 6.8rem);
      font-weight: 400;
      line-height: 0.96;
      letter-spacing: -0.04em;
    }

    .message {
      max-width: 620px;
      margin: clamp(22px, 3vh, 32px) 0 0;
      font-size: clamp(1rem, 1.25vw, 1.25rem);
      line-height: 1.5;
    }

    .accent {
      position: relative;
      background: var(--nyl-light-blue);
      overflow: hidden;
    }

    .accent::before {
      content: "";
      position: absolute;
      width: clamp(130px, 12vw, 190px);
      aspect-ratio: 1;
      right: -42px;
      top: -42px;
      background: var(--nyl-blue);
    }

    .accent::after {
      content: "";
      position: absolute;
      width: clamp(90px, 8vw, 130px);
      aspect-ratio: 1;
      left: -30px;
      bottom: -30px;
      background: var(--white);
    }

    .site-footer {
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 6px clamp(32px, 6vw, 88px) 12px;
      color: #333333;
      font-size: 0.8rem;
      line-height: 1.4;
    }

    @media (max-height: 760px) and (min-width: 761px) {
      .site-header {
        height: 88px;
        padding-top: 16px;
        padding-bottom: 16px;
      }

      .logo { width: 70px; }
      .hero-wrap { padding-top: 18px; padding-bottom: 28px; }
      .hero-copy { padding-top: 34px; padding-bottom: 34px; }
      h1 { font-size: clamp(3.2rem, 6vw, 5.8rem); }
      .message { margin-top: 20px; }
      .site-footer { min-height: 40px; padding-top: 8px; padding-bottom: 10px; }
    }

    @media (max-width: 760px) {
      .site-shell {
        height: auto;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: visible;
      }

      .site-header {
        height: 92px;
      }

      .hero-wrap {
        padding: 20px 20px 24px;
      }

      .hero {
        min-height: 560px;
        height: auto;
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) 96px;
      }

      .hero-copy {
        padding: 48px 30px 54px;
      }

      h1 {
        font-size: clamp(3.1rem, 15vw, 5rem);
      }

      .site-footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
<div class="site-shell">
  <header class="site-header" aria-label="New York Life">
    <img class="logo" src="images/logo.png" alt="New York Life" />
  </header>

  <main class="hero-wrap">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <h1 id="page-title">Under construction</h1>
        <p class="message">We’re working on this site. Please check back soon.</p>
      </div>
      <div class="accent" aria-hidden="true"></div>
    </section>
  </main>

  <footer class="site-footer">
    <span>New York Life Insurance Company</span>
  </footer>
</div>
</body>
</html>
