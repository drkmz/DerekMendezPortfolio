<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0468FF" />
  <title>Under construction | New York Life</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <style>
    :root {
      --nyl-blue: #0468FF;
      --nyl-dark-blue: #000A62;
      --nyl-light-blue: #80BAFF;
      --white: #FFFFFF;
      --black: #000000;
      --light-gray: #E3E0DD;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      background: var(--white);
      color: var(--black);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .site-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .site-header {
      display: flex;
      align-items: center;
      min-height: 112px;
      padding: 24px clamp(24px, 5vw, 72px);
      background: var(--white);
      border-bottom: 1px solid var(--light-gray);
    }

    .logo {
      display: block;
      width: clamp(72px, 7vw, 96px);
      height: auto;
    }

    .hero-wrap {
      display: flex;
      align-items: stretch;
      padding: clamp(24px, 4vw, 56px) clamp(24px, 5vw, 72px) clamp(40px, 6vw, 80px);
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: min(640px, 68vh);
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(220px, 0.45fr);
      overflow: hidden;
      background: var(--nyl-dark-blue);
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(48px, 8vw, 112px);
      color: var(--white);
    }

    .eyebrow {
      margin: 0 0 24px;
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.01em;
    }

    h1 {
      max-width: 780px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.3rem, 8vw, 7.4rem);
      font-weight: 400;
      line-height: 0.93;
      letter-spacing: -0.04em;
    }

    .message {
      max-width: 620px;
      margin: 32px 0 0;
      font-size: clamp(1.05rem, 1.5vw, 1.3rem);
      line-height: 1.55;
    }

    .accent {
      position: relative;
      background: var(--nyl-light-blue);
      overflow: hidden;
    }

    .accent::before {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      right: -62px;
      top: -62px;
      background: var(--nyl-blue);
    }

    .accent::after {
      content: "";
      position: absolute;
      width: 130px;
      height: 130px;
      left: -42px;
      bottom: -42px;
      background: var(--white);
    }

    .site-footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding: 0 clamp(24px, 5vw, 72px) 28px;
      color: #333333;
      font-size: 0.8rem;
      line-height: 1.5;
    }

    @media (max-width: 760px) {
      .site-header {
        min-height: 96px;
      }

      .hero-wrap {
        padding-top: 24px;
      }

      .hero {
        min-height: 600px;
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 118px;
      }

      .hero-copy {
        padding: 56px 32px 64px;
      }

      h1 {
        font-size: clamp(3.3rem, 16vw, 5rem);
      }

      .accent::before {
        width: 130px;
        height: 130px;
        right: -40px;
        top: -40px;
      }

      .accent::after {
        width: 92px;
        height: 92px;
        left: -30px;
        bottom: -30px;
      }

      .site-footer {
        flex-direction: column;
        gap: 6px;
      }
    }
  </style>
</head>
<body>
<div class="site-shell">
  <header class="site-header" aria-label="New York Life">
    <img class="logo" src="images/logo.png" alt="New York Life" />
  </header>

  <main class="hero-wrap">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <p class="eyebrow">Website update</p>
        <h1 id="page-title">Under construction</h1>
        <p class="message">We’re working on this site and look forward to welcoming you back soon.</p>
      </div>
      <div class="accent" aria-hidden="true"></div>
    </section>
  </main>

  <footer class="site-footer">
    <span>New York Life Insurance Company</span>
    <span>Website temporarily unavailable</span>
  </footer>
</div>
</body>
</html>
